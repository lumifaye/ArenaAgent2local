name: Build Windows installer and publish release

on:
  push:
    branches:
      - 'arena/8393bb53-arenaagent2local'
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match package.json version '$expectedTag'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: pwsh
        run: |
          $testOutput = & npm test 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host $_ }
          if ($testExitCode -ne 0) {
            $inFailure = $false
            foreach ($entry in $testOutput) {
              $line = [string]$entry
              if ($line -match '^not ok ') { $inFailure = $true }
              if ($inFailure -and $line -match '^not ok |^  error:|^  code:|^  name:|^  stack:|^  location:|^  failureType:|^  actual:|^  expected:|^    (The expression|Expected|AssertionError|Error:)') {
                $escaped = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A').Replace(':', '%3A').Replace(',', '%2C')
                Write-Output "::error title=Node test failure::$escaped"
              }
              if ($inFailure -and $line.Trim() -eq '...') { $inFailure = $false }
            }
          }
          exit $testExitCode

      - name: Build Windows x64 installer
        run: npm run dist -- --win nsis --x64 --publish never

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = 'release/Arena-Local-Setup.exe'
          if (-not (Test-Path $installer)) {
            Get-ChildItem release -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Expected installer '$installer' was not produced."
          }
          Write-Host "Built $installer"

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Arena-Local-Setup
          path: release/Arena-Local-Setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish versioned GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: Arena-Local-Setup
          path: release

      - name: Generate installer SHA-256 checksum
        run: sha256sum release/Arena-Local-Setup.exe | awk '{ print $1 "  Arena-Local-Setup.exe" }' > release/Arena-Local-Setup.exe.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Arena Local ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/Arena-Local-Setup.exe
            release/Arena-Local-Setup.exe.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
